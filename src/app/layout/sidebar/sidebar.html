<aside class="barra-lateral">
  <div class="zona-logo">
    <img src="/img/LOGO GRANDE.png" alt="Karely's" class="logo-empresa" />
  </div>
  <div class="titulo-panel">{{esDoctor ? 'PANEL MÉDICO' : 'PANEL DE ADMINISTRACIÓN'}}</div>
  <nav class="menu-lateral">
    @for(item of menu;track item.path){<a
      [routerLink]="item.path"
      routerLinkActive="activa"
      [routerLinkActiveOptions]="{paths: item.path === '/doctor' ? 'exact' : 'subset', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored'}"
      ariaCurrentWhenActive="page"
      class="opcion-menu"
      ><img [src]="'/img/'+item.icon" alt="" /><span>{{item.label}}</span></a
    >}
  </nav>
</aside>
