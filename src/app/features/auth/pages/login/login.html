<main class="contenedor-login">
  <section class="zona-imagen">
    <a routerLink="/home" class="boton-regresar"
      ><span class="circulo-flecha">←</span><span>Regresar</span></a
    ><img
      src="/img/FONDO LOGIN.png"
      alt="Consultorio médico"
      class="imagen-consultorio"
    />
  </section>
  <div class="separador-azul"></div>
  <section class="zona-formulario">
    <div class="contenido-formulario">
      <img
        src="/img/LOGO GRANDE.png"
        alt="Logo Karely's"
        class="logo-karelys"
      />
      <h1>INICIAR SESIÓN</h1>
      <p class="texto-ayuda">
        Ingrese sus credenciales para acceder al sistema
      </p>
      @if(aviso){
      <p class="mensaje-error" role="status">{{aviso}}</p>
      }
      <form
        class="formulario-login"
        [formGroup]="loginForm"
        (ngSubmit)="login()"
      >
        <input
          name="username"
          formControlName="username"
          placeholder="Ingrese su usuario"
          required
          autocomplete="username"
        />
        <div class="caja-contrasena">
          <input
            [type]="mostrar?'text':'password'"
            name="password"
            formControlName="password"
            placeholder="Contraseña"
            required
            autocomplete="current-password"
          /><button type="button" class="boton-ojo" (click)="mostrar=!mostrar">
            ◉
          </button>
        </div>
        @if(error){
        <p class="mensaje-error" role="alert">{{error}}</p>
        }
        <button class="boton-ingresar" type="submit" [disabled]="loading">
          {{loading?'Ingresando...':'Iniciar Sesión'}}
        </button>
      </form>
      <a class="enlace-recuperacion" routerLink="/recuperar-password"
        >Olvidé mi contraseña</a
      >
    </div>
  </section>
</main>
